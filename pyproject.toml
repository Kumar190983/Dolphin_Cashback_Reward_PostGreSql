[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dolphin-cashback-reward"
version = "0.1.0"
description = "A Streamlit app for managing cashback review submissions."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.37.0",
    "pandas>=2.0.0",
    "qrcode[pil]>=7.4",
    "openpyxl>=3.1.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
]

[tool.setuptools]
py-modules = ["app", "db"]
